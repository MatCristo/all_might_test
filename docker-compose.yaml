services:
  db:
    container_name: "test_db"
    image: "postgres"
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgresPassword
    networks:
      - test-network
    volumes:
      - './test/database/create_database.sql:/docker-entrypoint-initdb.d/create_database.sql'
    ports:
    - "4300:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  localstack:
    container_name: "localhost.localstack.cloud"
    image: localstack/localstack:3.8
    environment:
      - DEBUG=0
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "./test/localstack/config_localstack.py:/etc/localstack/init/ready.d/config_localstack.py"
      - "./test/localstack/application_metrics.py:/etc/localstack/application_metrics.py"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - test-network
    ports:
      - 4566:4566
    # Healthy only once the init scripts have finished (the secret, the log
    # group and the seeded metric), not merely once LocalStack answers.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 30
  
  all_might:
    container_name: all_might
    image: golang:1.24.0-alpine
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ALLOW_ORIGIN=http://localhost:5173
      - COOKIE_SECURE_MODE=false
    #command: sh -c "cd /app && go mod tidy && go run ."
    command: sh -c "tail -f /dev/null"
    volumes:
      - ".:/app"
    networks:
      - test-network
    ports:
      - 1323:1323
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

networks:
  test-network:
    driver: bridge